name: 故障反馈
description: 报告可复现的问题，不要上传密钥、音色私有引用或群聊隐私。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先阅读 SECURITY.md。使用自制测试音频复现，不上传真实群聊或未经授权的歌曲。
  - type: input
    id: versions
    attributes:
      label: 插件、AstrBot和Python版本
      placeholder: 插件0.3.0 / AstrBot4.29.1 / Python3.12
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 写明从哪个页面或命令开始，以及预期和实际结果。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏错误信息
      description: 不要贴API Key、voice-aliases.json、真实群号或完整配置。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已经移除凭据、私有音色引用和同学个人信息。
          required: true
