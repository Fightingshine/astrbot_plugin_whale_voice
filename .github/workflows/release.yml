name: 验证并发布版本
"on":
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: 检出已推送的标签
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 设置Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 核对标签版本
        shell: python
        run: |
          import os, re
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from build_release import release_version
          assert os.environ['GITHUB_REF_NAME'] == 'v' + release_version(Path.cwd()), '标签与运行版本不一致'
      - name: 构建公开源码包
        run: python scripts/build_release.py
      - name: 发布源码包与SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build_artifacts/*.zip build_artifacts/*.sha256 --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
