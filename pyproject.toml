[project]
name = "astrbot-plugin-whale-voice"
version = "0.3.2"
description = "AstrBot 按需语音与预置曲库管理"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Fightingshine"}]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".venv", "build_artifacts", "browser_artifacts", "data", "plugin_data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/test_main.py" = ["E402"]
"scripts/migrate_voice_config.py" = ["E402"]
"scripts/manage_library.py" = ["E402"]
